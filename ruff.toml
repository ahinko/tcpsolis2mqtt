# Ruff's default rule set grows with each release, and CI installs ruff unpinned, so
# a new ruff can turn a green branch red without a line of code changing. That is
# what happened to the pytest 9 bump: 66 errors, none of them from the pull request,
# and the run never reached the tests.
#
# So say which rules apply rather than inheriting whatever the latest default is.
# Ruff stays current, and adopting a new rule stays a deliberate decision with its
# own commit rather than an ambush on an unrelated PR.

# Matches the Dockerfile (python:3.14.5-alpine) and CI (3.14.1). The app only ever
# runs on the version the image ships, so there is nothing to gain from claiming an
# older floor.
#
# One consequence worth knowing before this is lowered again: PEP 758 lets 3.14
# write `except TypeError, ValueError:` without parentheses, and at py314 the
# formatter strips them. It is valid 3.14, but it reads like the Python 2
# `except X, e:` idiom, and it means the source no longer parses on 3.13.
target-version = "py314"

[lint]
# Ruff's historical default: a subset of pycodestyle plus all of Pyflakes.
#   E4  imports          E7  statements          E9  runtime and IO errors
#   F   Pyflakes: undefined names, unused imports and variables, f-string bugs
select = ["E4", "E7", "E9", "F"]

# Worth adopting deliberately at some point, each in its own change:
#   I     import sorting, auto-fixable
#   LOG   logging correctness. 42 hits, all of them logging.info on the root logger,
#         which is the style throughout app/. Would mean a module logger.
#   BLE   blind excepts. 5 hits, and query_modbus catching bare Exception is load
#         bearing, so this one needs thought rather than a fix.
