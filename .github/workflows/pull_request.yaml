name: On pull request

on:
  pull_request:
    branches: ["main"]

jobs:
  python_checks:
    runs-on: ubuntu-latest
    name: Python Checks
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Read from the Dockerfile rather than repeating the version here. Two
      # copies meant two Renovate dependencies with different constraints: the
      # Dockerfile could not leave the alpine line it was pinned to, a bare
      # version had no such limit, and a PR moved one without the other.
      - name: Read the Python version from the Dockerfile
        id: python
        run: |
          version="$(sed -n 's/^FROM python:\([0-9][0-9.]*\)-.*/\1/p' Dockerfile)"
          if [ -z "$version" ]; then
            echo "::error::no Python version found in the Dockerfile FROM line"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python ${{ steps.python.outputs.version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Install requirements
        run: |
          python3 -m pip install -U pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements-dev.txt
          python3 -m pip install ruff

      - name: Check formatting
        run: |
          ruff format --check --diff app tests

      - name: Check lint
        run: |
          ruff check app tests

      - name: Run tests
        run: |
          python3 -m pytest tests -q

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test
        uses: docker/build-push-action@v7
        with:
          push: false
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
