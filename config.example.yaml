---
debug: False
datalogger:
  host:
  port: 502
  device_id: 1
  poll_interval: 60
  poll_interval_if_off: 600
  poll_retries: 10
  register_chunks: 20
  # Keep the modbus connection open between polls instead of dialling a new one every
  # poll. The datalogger accepts one connection at a time, so with this on nothing
  # else can reach it -- including Solis Cloud. Leave it off unless you are measuring
  # what it does; the app logs a line for every connection it opens.
  persistent_connection: False
  http:
    enabled: True
    user: admin
    password: "123456789"
# Required
inverter:
  name: Solis
  manufacturer: Ginlong Technologies
  model: S5-GR3P15K
  # Required. The nameplate rating of YOUR inverter, in kW. Used to reject energy
  # counter readings that climb faster than it could possibly have generated, so a
  # wrong value makes that check either useless or actively harmful. Not a tuning
  # knob: if real readings are being rejected, the cause is elsewhere.
  max_power_kw: 15
mqtt:
  enabled: True
  host:
  port: 1883
  topic_prefix: tcpsolis2mqtt
  client_id: tcpsolis2mqtt
  user:
  password:
  use_ssl: False
  validate_cert: False
